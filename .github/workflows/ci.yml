name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The engine is C#, compiled ahead of time into a native library. It has to exist before the Swift code
      # will link, so it is built first, exactly as build-app.sh does locally.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: swift --version
      - name: The engine
        run: engine/build.sh arm64

      - run: swift build -c release
      - name: The app's checks, and the engine's from inside it
        run: .build/release/Plain selftest
      - run: swift test
      - name: End to end through the command line
        run: tests/integration.sh .build/release/Plain

      # The engine here is a copy of the one in plainwin. A copy can drift, and drift would break the one thing
      # this app is for: both programs agreeing about what a file is because they run the same code.
      - name: The engine has not drifted from plainwin
        run: tests/engine-sync.sh

      - name: The README's claims have to be true
        run: tests/docs.sh

      # The mistake that kept happening was code that worked, wired to nothing. This asks, of every operation the
      # engine knows, whether anywhere in the window can reach it.
      - name: Every operation has a way to it
        run: tests/reachable.sh
